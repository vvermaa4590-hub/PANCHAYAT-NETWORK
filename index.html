<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>पंचायत नेटवर्क - सरपंच चुनाव एवं वोटर सहायता</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; }
        header { background-color: #075e54; color: white; text-align: center; padding: 15px; }
        .container { max-width: 500px; margin: 20px auto; padding: 15px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 15px; }
        input, select, textarea, button { width: 100%; margin: 8px 0; padding: 10px; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background-color: #128c7e; color: white; border: none; font-weight: bold; cursor: pointer; }
        .btn-whatsapp { background-color: #25d366; color: white; font-size: 16px; }
    </style>
</head>
<body>

    <header>
        <h1>पंचायत नेटवर्क</h1>
        <p>ग्राम पंचायत चुनाव - प्रचार एवं वोटर सहायता</p>
    </header>

    <div class="container">
        <div class="card">
            <h3>वार्ड प्रचार एवं वोटर लिस्ट भेजें</h3>
            <label>वार्ड चुनें:</label>
            <select id="ward-select">
                <option value="वार्ड 1">वार्ड 1</option>
                <option value="वार्ड 2">वार्ड 2</option>
                <option value="वार्ड 3">वार्ड 3</option>
                <option value="वार्ड 4">वार्ड 4</option>
                <option value="वार्ड 5">वार्ड 5</option>
            </select>

            <input type="text" id="voter-phone" placeholder="मतदाता का व्हाट्सएप नंबर (10 अंक)">
            <textarea id="custom-msg" rows="3">नमस्कार! हमारे सरपंच प्रत्याशी के समर्थन हेतु एवं अपने वार्ड की वोटर लिस्ट की जानकारी के लिए संपर्क करें।</textarea>
            
            <button onclick="sendWhatsAppMessage()" class="btn-whatsapp">
                📱 व्हाट्सएप पर सीधे मैसेज भेजें
            </button>
        </div>
    </div>

    <script>
        function sendWhatsAppMessage() {
            const phone = document.getElementById('voter-phone').value;
            const ward = document.getElementById('ward-select').value;
            const customMsg = document.getElementById('custom-msg').value;

            if (!phone || phone.length < 10) {
                alert("कृपया सही 10 अंकों का मोबाइल नंबर दर्ज करें।");
                return;
            }

            const fullMessage = `${customMsg}\n\n📍 ${ward}`;
            const encodedMessage = encodeURIComponent(fullMessage);
            
            const whatsappUrl = `https://wa.me/91${phone}?text=${encodedMessage}`;
            window.open(whatsappUrl, '_blank');
        }
    </script>
</body>
                  </html>
